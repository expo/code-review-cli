name: ref-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ref-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate LLP references and metadata
        run: ./ref-check --verbose
