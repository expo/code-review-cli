name: ref-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ref-check:
    runs-on: expo-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ref-check is a python3 script. GitHub-hosted images ship python3; a
      # self-hosted one is not guaranteed to, so ask for it explicitly.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate LLP references and metadata
        run: ./ref-check --verbose

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The same grammar, applied to this repo's own review setup (see LLP 0012).
      - name: Validate review-setup refs
        run: bun run src/cli.ts ref-check
