name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Comment-only: read the repo, write PR comments (issue comments API).
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Trigger policy lives in .expo-code-review/config.jsonc (review.trigger); `ecr ci`
    # self-gates on it (and honors the ai-review:skip label). This coarse gate just
    # avoids spinning up a runner for a PR that explicitly opted out. Uses the array
    # form of contains() for an EXACT label match (the old join()+substring form
    # matched "ai-review:skip" as containing "ai-review").
    # Prefer to gate entirely here instead? Set config trigger to "label" (or "all")
    # and replace the line below with, e.g.:
    #   if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ai-review:skip') }}
    # Backstop so a stalled review fails fast instead of hanging. The ONE cap with no
    # soft landing (a hard kill posts nothing), so it stays well above the passes
    # budget (55m) + coordinator (10m) + verification + setup.
    timeout-minutes: 90
    # A reviewer failure must never fail the PR's checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow is enough — the reviewer gets the diff from the API (`gh`).
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SECURITY: this workflow checks out the PR's code, including
      # .expo-code-review/config.jsonc, whose auth.tokenEnv names the env var the CLI
      # forwards as the model credential. `ecr verify-config` is the canonical guard
      # (ships with the CLI): it parses every config with the real JSONC parser and
      # refuses unless tokenEnv appears exactly once, in a ROOT-owned file, equal to
      # the expected value (repo var ECR_EXPECTED_TOKEN_ENV) so a PR can't repoint it
      # at another runner secret. This repo self-reviews from its OWN source (not the
      # published package), so the guard runs from source too — same engine as `ci`.
      - name: Guard config tokenEnv
        env:
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CODEX_OAUTH_ACCESS_TOKEN,OPENAI_API_KEY' }}
        run: bun run src/cli.ts verify-config

      - name: Run AI review
        # True self-review: this repo IS the reviewer, so run the CLI from the PR's
        # own source instead of the published npm package. `bun run` puts
        # node_modules/.bin (which has the `opencode` binary) on PATH.
        run: bun run src/cli.ts ci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Layer-1 auth lock: `ecr ci` re-checks the honored tokenEnv at runtime,
          # catching what the guard step above can't. Keep in sync with the guard.
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CODEX_OAUTH_ACCESS_TOKEN,OPENAI_API_KEY' }}
          # Mixed credentials (see config.jsonc auth.providers): the ChatGPT/Codex
          # subscription ACCESS token serves the default models; the usage-based
          # API key (project-scoped, inference-only, budget-capped) serves the
          # pro-tier security pass. ECR_EXPECTED_TOKEN_ENV (repo variable) locks
          # the comma-separated set of BOTH names.
          CODEX_OAUTH_ACCESS_TOKEN: ${{ secrets.CODEX_OAUTH_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: override the model for every agent (uses your OpenCode login).
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
