name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Comment-only: read the repo, write PR comments (issue comments API).
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: expo-large
    # Trigger policy lives in .expo-code-review/config.jsonc (review.trigger); `ecr ci`
    # self-gates on it (and honors the ai-review:skip label). This coarse gate just
    # avoids spinning up a runner for a PR that explicitly opted out. Uses the array
    # form of contains() for an EXACT label match (the old join()+substring form
    # matched "ai-review:skip" as containing "ai-review").
    # Prefer to gate entirely here instead? Set config trigger to "label" (or "all")
    # and replace the line below with, e.g.:
    #   if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ai-review:skip') }}
    # Backstop so a stalled review fails fast instead of hanging. The ONE cap with no
    # soft landing (a hard kill posts nothing), so it stays well above the passes
    # budget (55m) + coordinator (10m) + verification + setup.
    timeout-minutes: 90
    # A reviewer failure must never fail the PR's checks.
    continue-on-error: true
    steps:
      # SECURITY: check out the PR's immutable BASE commit, never the PR head or
      # merge ref. This repo self-reviews from source, so the base checkout is what
      # keeps a PR from rewriting the ENGINE that reviews it — engine (and config)
      # changes activate after merge, exactly like the trust model `ecr ci` enforces
      # for config internally. persist-credentials off — the CLI's own git fetches
      # authenticate through `gh` from GH_TOKEN, so the token never lands in
      # .git/config.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Shallow is enough — the reviewer gets the diff from the API (`gh`).
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # `ecr ci` reads the whole PR through `gh`, which GitHub-hosted images ship and
      # ours do not. Pinned by version AND sha256: this binary runs with GH_TOKEN and
      # the model credential in its environment, so "whatever the image happens to
      # ship" is a worse answer than one we can name. Installs into $HOME, never the
      # workspace — resolveTrustedTool refuses a `gh` found inside the reviewed tree.
      - name: Install gh
        env:
          GH_VERSION: "2.97.0"
          GH_SHA256: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
        run: |
          set -euo pipefail
          tarball="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${tarball}"
          echo "${GH_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check gh is available
        run: gh --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The claude-code auth mode runs reviews through the Claude Code CLI on a
      # Max/Team subscription (see .expo-code-review/config.jsonc). Pinned exactly,
      # like `opencode-ai` in package.json — an unpinned CLI would silently drift
      # on every CI run; bump it deliberately.
      - name: Install Claude Code CLI
        run: bun install -g @anthropic-ai/claude-code@2.1.212

      # SECURITY: the TRUSTED BASE checkout above includes .expo-code-review/
      # config.jsonc, whose auth.tokenEnv names the env var the CLI forwards as the
      # model credential. `ecr verify-config` is the canonical guard (ships with the
      # CLI): it parses every config with the real JSONC parser and refuses unless
      # tokenEnv appears exactly once, in a ROOT-owned file, equal to the expected
      # value (repo var ECR_EXPECTED_TOKEN_ENV). This repo self-reviews from BASE
      # source, so the guard runs from that same base source — same engine as `ci`.
      - name: Guard config tokenEnv
        env:
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_OAUTH_TOKEN' }}
        run: bun run src/cli.ts verify-config

      - name: Run AI review
        # True self-review: this repo IS the reviewer, so run the CLI from source —
        # the trusted BASE commit's source (see the checkout above), never the PR's.
        # `bun run` puts node_modules/.bin (which has the `opencode` binary) on PATH.
        # `ecr ci` materializes the PR head itself (OID-pinned, scrubbed of ambient
        # runtime config) for the reviewers' source reads.
        run: bun run src/cli.ts ci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Layer-1 auth lock: `ecr ci` re-checks the honored tokenEnv at runtime,
          # catching what the guard step above can't. Keep in sync with the guard.
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_OAUTH_TOKEN' }}
          # Claude Max/Team subscription token minted by `claude setup-token`
          # (~1 year lifetime). The claude-code engine forwards it to the Claude
          # Code CLI as the only credential (any ANTHROPIC_* key is stripped).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional: override the model for every agent.
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
